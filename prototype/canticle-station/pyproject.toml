[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binary-canticle-station"
version = "0.1.0"
description = "Spike: RFC-0001 frame v2 codec, looping station and listener for Binary Canticle"
requires-python = ">=3.11"
dependencies = ["cryptography>=45"]

[project.scripts]
canticle = "canticle.__main__:main"

[tool.setuptools]
packages = ["canticle"]

[tool.setuptools.package-data]
canticle = ["web/*"]
