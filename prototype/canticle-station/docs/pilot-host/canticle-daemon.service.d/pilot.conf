# Drop-in for docs/systemd/canticle-daemon.service on a LAN pilot host (binary-canticle#103). Documented only;
# the host owner installs it beside the base unit (README.md in docs/pilot-host/, step 4):
#
#   ~/.config/systemd/user/canticle-daemon.service
#   ~/.config/systemd/user/canticle-daemon.service.d/pilot.conf
#
# The daemon binds CANTICLE_BIND, one exact IPv4 LAN address and port, read from ~/.binary-canticle/pilot.env:
#
#   CANTICLE_BIND=10.0.0.100:9999
#
# Multicast stays off whatever stations.toml says. Before every start, canticle-pilot-guard.sh refuses a wildcard
# or malformed bind, and refuses to start unless table inet canticle (canticle-pilot.nft) is loaded and scopes
# that address and port. Check what systemd will run with `systemctl --user cat canticle-daemon`.

[Service]
# No "-" before the path: without the file the unit does not start.
EnvironmentFile=%h/.binary-canticle/pilot.env
# "+" runs the guard without the base unit's NoNewPrivileges=yes, which would stop sudo from reading the table as
# root. It still runs as this seat's uid, and the daemon itself keeps NoNewPrivileges. A refusal fails the start;
# Restart=on-failure tries again every 5 s, so a daemon that starts before the table is loaded comes up once it is.
ExecStartPre=+/bin/sh %h/.binary-canticle/canticle-pilot-guard.sh
ExecStart=
ExecStart=%h/.venvs/canticle/bin/canticle daemon --stations %h/.binary-canticle/stations.toml --bind ${CANTICLE_BIND} --no-multicast --socket %t/canticle/daemon.sock
